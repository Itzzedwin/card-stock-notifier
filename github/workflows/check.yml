name: Check stock

on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub may delay these; expect 10-20 min in practice
  workflow_dispatch:          # lets the web GUI trigger "check now"
    inputs:
      test_ping:
        description: "Send a test notification to both topics instead of checking stock"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: check-stock
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Send test ping
        if: ${{ inputs.test_ping == true || inputs.test_ping == 'true' }}
        env:
          NTFY_TOPIC_ONEPIECE: ${{ secrets.NTFY_TOPIC_ONEPIECE }}
          NTFY_TOPIC_POKEMON: ${{ secrets.NTFY_TOPIC_POKEMON }}
        run: |
          sent=0
          for pair in "One Piece:$NTFY_TOPIC_ONEPIECE" "Pokemon:$NTFY_TOPIC_POKEMON"; do
            label="${pair%%:*}"; topic="${pair#*:}"
            if [ -z "$topic" ]; then
              echo "::warning::no secret set for the $label topic - skipped"
              continue
            fi
            curl -sS -f -o /dev/null \
              -H "Title: Test - the cloud watcher can reach you ($label)" \
              -H "Priority: high" -H "Tags: white_check_mark,cloud" \
              -d "This came from GitHub's servers, so real $label pings arrive the same way." \
              "https://ntfy.sh/$topic"
            echo "test ping sent to the $label topic"
            sent=$((sent+1))
          done
          if [ "$sent" -eq 0 ]; then echo "no topic secrets are set"; exit 1; fi

      - name: Run stock check
        if: ${{ !(inputs.test_ping == true || inputs.test_ping == 'true') }}
        env:
          # Per-target topics in config.json reference these by name, so One
          # Piece and Pokemon alerts land on separate topics without either
          # name appearing in this public repo.
          NTFY_TOPIC_ONEPIECE: ${{ secrets.NTFY_TOPIC_ONEPIECE }}
          NTFY_TOPIC_POKEMON: ${{ secrets.NTFY_TOPIC_POKEMON }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
        run: python stock_notifier.py --once

      - name: Persist state
        if: ${{ !(inputs.test_ping == true || inputs.test_ping == 'true') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update stock state [skip ci]"
            git pull --rebase origin main
            git push
          fi
